name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows-x86_64
            runner: windows-2022
          - target: macOS-arm64
            runner: macos-15
          - target: macOS-x86_64
            runner: macos-15-intel
          - target: Linux-x86_64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Validate release version
        shell: bash
        run: |
          python -c 'import os; from version import VERSION; ref = os.environ["GITHUB_REF"]; assert not ref.startswith("refs/tags/") or ref == "refs/tags/v" + VERSION, (ref, VERSION)'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke tests
        shell: bash
        run: |
          for test in gui testing controls prompt_builder local_context history privacy safety; do
            python "tests/smoke_${test}.py" || exit 1
          done
      - name: Build, test and archive native application
        run: python scripts/build_release.py
      - name: Check packaged Linux GUI with X11
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke_package.py
        env:
          QT_QPA_PLATFORM: xcb
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchAIBot-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: TwitchAIBot-*
          path: release
          merge-multiple: true
      - name: Verify checksums and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          cat *.sha256 > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Twitch AI Bot $RELEASE_TAG" --notes-file ../docs/release-notes.md
          gh release upload "$RELEASE_TAG" ./*.zip ./*.dmg ./*.tar.gz SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
