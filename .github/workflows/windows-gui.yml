name: Windows GUI

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -v
      - run: python tests/smoke_gui.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Chunda --add-data "memory.example.json;." app.py
      - run: python tests/smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Chunda-Windows
          path: dist/Chunda.exe
