name: Windows GUI

on:
  push:
    branches: [main, dev, 'feature/**', 'codex/interface-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -v
      - run: python tests/smoke_gui.py
      - run: python tests/smoke_windows_studio.py
      - run: python tests/smoke_orbit.py
      - run: python tests/smoke_orbit_fidelity.py
      - run: python tests/smoke_orbit.py
        env:
          QT_SCALE_FACTOR: '1.25'
      - run: python tests/smoke_orbit.py
        env:
          QT_SCALE_FACTOR: '1.5'
      - run: python tests/smoke_testing.py
      - run: python tests/smoke_controls.py
      - run: python tests/smoke_prompt_builder.py
      - run: python tests/smoke_local_context.py
      - run: python tests/smoke_history.py
      - run: python tests/smoke_privacy.py
      - run: python tests/smoke_safety.py
      - run: python -c "import json, subprocess; from pathlib import Path; Path('build-info.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}),encoding='utf-8')"
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TwitchAIBot --icon "assets/app.ico" --add-data "assets/app.ico;assets" --add-data "assets/checkmark.svg;assets" --add-data "assets/fonts;assets/fonts" --add-data "memory.example.json;." --add-data "build-info.json;." app.py
      - run: python tests/smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchAIBot-Windows
          path: dist/TwitchAIBot.exe
